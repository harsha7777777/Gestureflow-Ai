name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python -m gestureflow`
        2. ...
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Full error message
      description: Paste the complete output from the terminal, if any.
      render: text
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GestureFlow AI version or commit
      description: Output of `python -m gestureflow --version`
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not attach webcam images, videos or files from my user_data/ folder.
          required: true
