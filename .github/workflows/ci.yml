name: CI

on:
  # Pushes to main, plus every pull request. (Running on every branch push as
  # well would run the same checks twice for each PR commit.)
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (same version as requirements-dev.txt)
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS (Apple Silicon) is the primary development OS; Windows is the
        # second target, and Linux catches platform-specific breakage early.
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install system libraries (Linux only)
        # MediaPipe and Qt load OpenGL/EGL, font and keyboard libraries that
        # minimal Linux images lack.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install GestureFlow AI with dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Cache the hand model
        uses: actions/cache@v4
        with:
          path: models
          key: hand-model-${{ hashFiles('src/gestureflow/detection/model_file.py') }}
      - name: Download the hand model
        # Also tests the real download path, including the SHA-256 check.
        run: python -m gestureflow --download-model
      - name: Start the real hand detector once
        # Runs outside pytest so MediaPipe's own log messages are visible if it fails.
        # Not on macOS runners: MediaPipe for macOS always opens a Metal (GPU) helper,
        # and GitHub's macOS virtual machines have no Metal GPU, so MediaPipe aborts
        # ("graph_service.h: Check failed: service_ Service is unavailable" from
        # DrishtiMetalHelper). Every real Mac has Metal; there it is tested by hand.
        if: runner.os != 'macOS'
        run: >-
          python -c "import numpy as np;
          from gestureflow.detection.hand_detector import HandDetector;
          d = HandDetector();
          print('hands found in a blank frame:', d.detect(np.zeros((480, 640, 3), np.uint8), 0));
          d.close()"
      - name: Run tests
        # Tests never need a webcam; camera-only tests are marked and skipped.
        # GESTUREFLOW_NO_METAL: see the note on the step above.
        env:
          GESTUREFLOW_NO_METAL: ${{ runner.os == 'macOS' && '1' || '' }}
        run: pytest -m "not camera"
