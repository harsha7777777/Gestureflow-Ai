name: diag-macos-mediapipe
on:
  push:
    branches: [diag-macos-mediapipe]
jobs:
  probe:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mp: ["1.0.1", "1.1.0", "0.10.35", "0.10.21"]
        delegate: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mediapipe==${{ matrix.mp }}" numpy
      - run: curl -sSLo hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
      - run: python diag/probe.py ${{ matrix.delegate }} image
        continue-on-error: true
      - run: python diag/probe.py ${{ matrix.delegate }} video
      - run: system_profiler SPDisplaysDataType
        if: always()
